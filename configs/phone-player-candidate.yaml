capture:
  max_size: 960
  fps: 60
  bitrate: 4000000
detector:
  type: hybrid
  components:
  - type: openvino
    model: models/detector-experiments/player-reviewed-nbs4/weights/best_openvino_model
    imgsz: 320
    confidence: 0.45
    device: CPU
    roles:
      player:
        kind: player
        label: player
        radius_factor: 0.3
  - type: templates
    templates:
    - path: data\templates\orange_meteor.png
      kind: hazard
      label: orange_meteor
      threshold: 0.75
      max_objects: 20
      radius_factor: 0.5
    - path: data\templates\purple_meteor.png
      kind: hazard
      label: purple_meteor
      threshold: 0.75
      max_objects: 20
      radius_factor: 0.5
    - path: data\templates\blue_meteor.png
