      label: blue_meteor
      threshold: 0.75
      max_objects: 20
      radius_factor: 0.5
    - path: data\templates\starshot_split.png
      kind: item
      label: starshot_split
      threshold: 0.75
      max_objects: 20
      radius_factor: 0.5
    search_scale: 0.5
