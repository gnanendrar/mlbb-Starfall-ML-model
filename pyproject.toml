[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "starfall-agent"
version = "0.1.0"
description = "Local visual Android agent with predictive control and explicit evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "opencv-python>=4.10", "scipy>=1.11", "av>=14", "gymnasium>=1.0,<2", "PyYAML>=6", "psutil>=6"]

[project.optional-dependencies]
learn = ["ultralytics>=8.4", "stable-baselines3>=2.7", "openvino>=2025", "onnx>=1.17", "onnxruntime>=1.20"]
test = ["pytest>=8"]

[project.scripts]
starfall = "starfall.cli:main"

[tool.setuptools.packages.find]
include = ["starfall*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
